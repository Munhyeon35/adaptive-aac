name: Cross-platform checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      AAC_TEST_TORCH: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-torch.txt
      - name: Install CPU PyTorch on Windows and Linux
        if: runner.os != 'macOS'
        run: python -m pip install "torch>=2.6,<3" --index-url https://download.pytorch.org/whl/cpu
      - name: Install portable runtime
        run: python -m pip install -r requirements-torch.txt
      - name: Domain, API, subprocess, and real tiny Qwen training tests
        run: python -m unittest discover -s tests -v
      - name: Prepare Korean training data without downloads
        run: python setup_local.py --prepare-only
